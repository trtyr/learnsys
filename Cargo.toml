[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/trtyr/recall"

# 共享依赖版本：子 crate 用 `.workspace = true` 继承，避免版本漂移
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 2          # 看板类服务，2 够用，省编译时间
